name: orderflow

x-service: &service
  restart: unless-stopped
  depends_on:
    kafka: { condition: service_healthy }
    postgres: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORT/health || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  kafka:
    # Single-node Kafka in KRaft mode (Kafka's built-in controller, which replaces ZooKeeper).
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 3s
      timeout: 3s
      retries: 30

  order-service:
    <<: *service
    build: ./services/order-service
    ports: ["3001:3001"]
    environment:
      SERVICE_NAME: order-service
      PORT: 3001
      DATABASE_URL: postgres://orderflow:orderflow@postgres:5432/orders_db
      KAFKA_BROKERS: kafka:9092
      ENABLE_TEST_HOOKS: "true"

  payment-service:
    <<: *service
    build: ./services/payment-service
    ports: ["3002:3002"]
    environment:
      SERVICE_NAME: payment-service
      PORT: 3002
      DATABASE_URL: postgres://orderflow:orderflow@postgres:5432/payments_db
      KAFKA_BROKERS: kafka:9092
      PAYMENT_LIMIT_CENTS: 100000

  notification-service:
    <<: *service
    build: ./services/notification-service
    ports: ["3003:3003"]
    environment:
      SERVICE_NAME: notification-service
      PORT: 3003
      DATABASE_URL: postgres://orderflow:orderflow@postgres:5432/notifications_db
      KAFKA_BROKERS: kafka:9092
